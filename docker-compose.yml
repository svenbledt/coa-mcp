# For Coolify (Docker Compose application). Set the domain coa-mcp.bledt.dev on the service in Coolify:
# it generates the Traefik labels itself, so none are written here. No host port is published.
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      Layers__Root: /data
      # Coolify's Docker network. Forwarded client addresses (X-Forwarded-For, and CF-Connecting-IP when the request came through
      # cloudflared) are believed only from peers on this network.
      Network__TrustedProxies__0: 10.0.1.0/24
      # The network's gateway is never trusted: direct IPv6 clients reach Traefik through docker-proxy and appear to come from it,
      # so they share one rate-limit bucket and cannot pick their own with a forged CF-Connecting-IP.
      Network__UntrustedAddresses__0: 10.0.1.1
    volumes:
      # Read-write: the writable store lives at /data/writable (owned by UID 10001). Layer files are root-owned 0644 under 0755 folders,
      # so the server can read them but not change them, and it never opens them for writing.
      - /data/coamcp:/data
